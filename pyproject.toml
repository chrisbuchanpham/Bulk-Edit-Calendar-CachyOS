[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bulk-edit-calendar"
version = "0.1.0"
description = "A local, privacy-conscious bulk editor for Google Calendar on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Chris Buchan Pham"}]
keywords = ["google-calendar", "cachyos", "arch-linux", "calendar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "httpx2>=2.12,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S106"]

[project.scripts]
bulk-edit-calendar = "bulk_edit_calendar.cli:main"

[project.urls]
Homepage = "https://github.com/chrisbuchanpham/Bulk-Edit-Calendar-CachyOS"
Issues = "https://github.com/chrisbuchanpham/Bulk-Edit-Calendar-CachyOS/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_edit_calendar"]

[tool.hatch.build.targets.wheel.force-include]
"packaging/bulk-edit-calendar.desktop" = "share/applications/bulk-edit-calendar.desktop"
"packaging/io.github.chrisbuchanpham.BulkEditCalendar.svg" = "share/icons/hicolor/scalable/apps/io.github.chrisbuchanpham.BulkEditCalendar.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
